# Tool configuration only — runtime dependencies live in requirements*.txt.
# This is an application, not a distributable package, so there is no [build-system].

[project]
name = "product-catalog-intelligence"
version = "0.1.0"
description = "Turns messy multi-supplier product feeds into a clean, enriched, searchable catalog."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
warn_unused_configs = true

# pydantic v2 ships a mypy plugin; it gives the Settings model an accurate __init__.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "cloud: requires GCP credentials (opt-in via RUN_CLOUD_TESTS=1)",
    "integration: crosses module boundaries or touches local DuckDB",
]
