# Tool configuration only — dependencies live in requirements*.txt.
# This is an application, not a distributable package, so there is no [build-system].

[project]
name = "product-catalog-intelligence"
version = "0.1.0"
description = "Turns messy multi-supplier product feeds into a clean, searchable catalog."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# mypy is optional (make typecheck) and does not gate a slice.
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
